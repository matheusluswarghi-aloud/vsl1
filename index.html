  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {

    /* ── URGENCY BAR ── */

      top: 0;

      color: var(--gold-end);
    }

    /* ── MAIN CONTENT ── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 20px 64px;
    }

      width: 100%;
      max-width: 420px;
      position: relative;
      animation: fadeUp 0.9s 0.2s ease both;

      from { opacity: 0; transform: translateY(24px); }
